submission:
  title: "GridGuard AI"

  problem_statement: >
    Power-grid operators need to identify vulnerable equipment before failures
    become outages, but large grid datasets make it difficult to prioritize
    which assets require attention first. GridGuard AI helps operators identify
    high-risk equipment and understand the potential outage impact of failures.

  solution_summary: >
    GridGuard AI is an interactive predictive risk dashboard that analyzes grid
    asset data, scores equipment failure and outage risk, prioritizes vulnerable
    assets, explains potential impact, and provides preventive recommendations.
    It also includes a rule-based Operations Copilot MVP for natural-language
    operational queries.

  key_features:
    - "Equipment failure risk scoring and severity classification"
    - "Outage risk scoring based on failure likelihood and potential impact"
    - "Top vulnerable asset and zone-level risk prioritization"
    - "Asset impact analysis with preventive recommendations"
    - "Rule-based Operations Copilot MVP for operational queries"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "HTML"
      - "CSS"
    frameworks:
      - "FastAPI"
      - "Pandas"
    ibm_technologies:
      - "IBM Bob"
    databases: []
    other:
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    We are most proud of turning raw grid asset data into an actionable
    prioritization workflow rather than only displaying risk scores. GridGuard
    AI helps distinguish between the likelihood that equipment may fail and the
    potential consequence of that failure, allowing operators to focus on the
    assets where preventive action matters most.

  known_limitations: >
    The current demonstration uses synthetic grid data and a rule-based
    Operations Copilot MVP. The Copilot is designed as an extensible foundation
    for future IBM AI integration, but the current runtime does not claim to use
    IBM Bob as its inference engine. The project is a hackathon MVP and does not
    yet connect to live utility infrastructure or real-time grid telemetry.

