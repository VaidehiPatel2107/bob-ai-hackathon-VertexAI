submission:
  title: "GridGuard AI"                        # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >
    Power utilities face difficulty predicting equipment failures and
    power outages before they occur, leading to unexpected downtime,
    service disruption, and costly emergency maintenance. Grid operators
    need an intelligent system to identify high-risk equipment and take
    preventive action proactively.

  solution_summary: >
    GridGuard AI analyzes equipment health, load, temperature, maintenance,
    historical failure, and weather data to predict equipment failure and
    outage risk. It prioritizes the most vulnerable assets, estimates
    potential outage impact, and provides AI-powered preventive recommendations
    through an interactive grid operations dashboard.

  key_features:
    - "Equipment failure risk prediction"
    - "Power outage risk prediction"
    - "AI-powered risk prioritization of grid assets"
    - "Outage impact analysis and preventive action recommendations"
    - "IBM Bob-powered grid operations copilot"                         

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

